<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notifications — Teacher Portal</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0E9F6E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="teacher-style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar-mount"></div>
  <div class="main">
    <div class="topbar" id="topbar-mount"></div>

    <div class="card">
      <div id="notifList"><div class="center-note">Loading…</div></div>
    </div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script type="module">
import { requireTeacherAuth, dbx, doc, updateDoc, collection, query, where, getDocs, $ } from './teacher-common.js';
import { renderTeacherShell } from './teacher-shell.js';

const { teacher } = await requireTeacherAuth();
await renderTeacherShell({ active: 'notifications', title: 'Notifications', subtitle: 'Announcements and alerts', teacher });

if (!teacher) { $('notifList').innerHTML = '<div class="center-note">Your teacher profile has not been set up yet. Please contact the school admin.</div>'; }
else await loadNotifications();

async function loadNotifications(){
  const el = $('notifList');
  let snap;
  try {
    const q = query(collection(dbx, 'notifications'), where('teacherUid', '==', teacher.uid));
    snap = await getDocs(q);
  } catch (e) {
    el.innerHTML = '<div class="center-note">Could not load notifications — please check your internet connection and try again.</div>';
    return;
  }
  if (snap.empty) { el.innerHTML = '<div class="center-note">No notifications yet.</div>'; return; }
  const docs = snap.docs.slice().sort((a, b) => {
    const at = a.data().createdAt && a.data().createdAt.toDate ? a.data().createdAt.toDate().getTime() : 0;
    const bt = b.data().createdAt && b.data().createdAt.toDate ? b.data().createdAt.toDate().getTime() : 0;
    return bt - at;
  });
  el.innerHTML = docs.map(d => {
    const n = d.data();
    const when = n.createdAt && n.createdAt.toDate ? n.createdAt.toDate().toLocaleString() : '';
    return `<div class="complaint-item"><b>${n.type === 'salary' ? '💰 ' : '🔔 '}${n.title || 'Notification'}</b><div>${n.message || ''}</div><div class="meta">${when}</div></div>`;
  }).join('');

  const unread = docs.filter(d => !d.data().read);
  for (const d of unread) await updateDoc(doc(dbx, 'notifications', d.id), { read: true });
}
</script>
</body>
</html>
