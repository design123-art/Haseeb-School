<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Profile — Teacher Portal</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0E9F6E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="teacher-style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar-mount"></div>
  <div class="main">
    <div class="topbar" id="topbar-mount"></div>

    <div class="card" id="profileCard">
      <div class="profile-head">
        <div class="avatar" id="pAvatar" style="width:64px;height:64px;font-size:22px;border-radius:16px;">—</div>
        <div>
          <h2 id="pName">—</h2>
          <p id="pRole">—</p>
        </div>
      </div>
      <div id="profileFields" class="profile-fields"></div>
      <div id="profileNote" class="center-note hidden" style="text-align:left;padding:20px 2px 4px;"></div>
    </div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script type="module">
import { requireTeacherAuth, dbx, doc, getDoc, initials, ROLE_LABELS, $ } from './teacher-common.js';
import { renderTeacherShell } from './teacher-shell.js';

const { teacher } = await requireTeacherAuth();
await renderTeacherShell({ active: 'profile', title: 'My Profile', subtitle: 'Your staff record from the school office', teacher });

if (!teacher) {
  $('pName').textContent = 'Profile not set up';
  $('profileNote').textContent = 'Your teacher profile has not been set up yet. Please contact the school admin.';
  $('profileNote').classList.remove('hidden');
} else {
  $('pAvatar').textContent = initials(teacher.name);
  $('pName').textContent = teacher.name || '—';
  $('pRole').textContent = ROLE_LABELS[teacher.role] || teacher.role || '—';
  await loadStaffRecord();
}

// Fields we know to expect from the desktop software's Staff Management page,
// shown in this order when present. Anything else saved on the staff record
// is still shown automatically underneath, so this stays in sync even if the
// admin adds custom fields on the desktop side.
const KNOWN_FIELDS = [
  { key: 'designation', label: 'Designation' },
  { key: 'fatherName', label: "Father / Husband Name" },
  { key: 'cnic', label: 'CNIC' },
  { key: 'phone', label: 'Phone Number' },
  { key: 'email', label: 'Email' },
  { key: 'address', label: 'Address' },
  { key: 'qualification', label: 'Qualification' },
  { key: 'department', label: 'Department' },
  { key: 'joiningDate', label: 'Date of Joining' },
  { key: 'bloodGroup', label: 'Blood Group' },
  { key: 'emergencyContact', label: 'Emergency Contact' },
  { key: 'salary', label: 'Monthly Salary' },
  { key: 'staffId', label: 'Staff ID' }
];
const SKIP_KEYS = new Set(['name', 'photo', 'createdAt', 'updatedAt', 'uid', 'authUid']);

async function loadStaffRecord(){
  const fieldsEl = $('profileFields');
  if (!teacher.staffId) {
    $('profileNote').textContent = 'Your login isn\'t linked to a Staff ID yet, so your office record can\'t be shown here. Ask the admin to check your account in Teacher Accounts on the desktop software.';
    $('profileNote').classList.remove('hidden');
    return;
  }
  let data = null;
  try {
    const snap = await getDoc(doc(dbx, 'staff', teacher.staffId));
    if (snap.exists()) data = snap.data();
  } catch (e) {
    $('profileNote').textContent = 'Could not load your staff record — please check your internet connection and try again.';
    $('profileNote').classList.remove('hidden');
    return;
  }
  if (!data) {
    $('profileNote').textContent = 'No staff record was found for your Staff ID yet. This appears once the admin adds you in Staff Management on the desktop software.';
    $('profileNote').classList.remove('hidden');
    return;
  }
  if (data.name) $('pName').textContent = data.name;
  if (data.designation) $('pRole').textContent = data.designation;

  let html = '';
  KNOWN_FIELDS.forEach(f => {
    if (data[f.key] !== undefined && data[f.key] !== null && data[f.key] !== '') {
      html += fieldHtml(f.label, data[f.key]);
    }
  });
  // Anything else on the record that isn't already shown / isn't meant to be shown.
  Object.keys(data).forEach(k => {
    if (SKIP_KEYS.has(k) || KNOWN_FIELDS.some(f => f.key === k)) return;
    if (data[k] === undefined || data[k] === null || data[k] === '') return;
    html += fieldHtml(labelize(k), data[k]);
  });

  fieldsEl.innerHTML = html || '<div class="center-note">No additional details on file.</div>';
}

function fieldHtml(label, value){
  return `<div class="profile-field"><label>${label}</label><div>${escapeHtml(String(value))}</div></div>`;
}
function labelize(key){
  return key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()).trim();
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
